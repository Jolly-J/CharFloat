<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>字浮 CharFloat · 马上就绪</title><link rel="stylesheet" href="style.css"></head><body>
<main class="card"><header><span class="wordmark">字浮 <b>CharFloat</b></span><button id="close" aria-label="关闭"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4 4L12 12M12 4L4 12"/></svg></button></header>
<div class="scene"><span class="orbit one"></span><span class="orbit two"></span><img id="character" src="assets/hello.png" alt="字浮向你打招呼"></div>
<section aria-live="polite"><span class="eyebrow" id="eyebrow">你好，很高兴见到你</span><h1 id="title">字浮，马上就绪。</h1><p id="description">稍等片刻，我来为你准备好一切。</p></section>
<div class="bottom"><div id="progress-area" hidden><div class="progress-heading"><span id="status">正在核对文件</span><span id="amount"></span></div><progress id="progress" max="100" value="0" aria-label="当前阶段文件进度"></progress><p id="current-file"></p></div>
<button id="launch" hidden disabled>开始使用</button><div id="error" hidden></div>
<p class="note" id="note">仅为当前用户配置 · 无需管理员权限</p></div></main>
<script src="renderer.js"></script></body></html>
