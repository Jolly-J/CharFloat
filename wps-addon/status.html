<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>字浮 CharFloat 运行状态</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 14px;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .badge-ready {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .badge-online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .dot-ready { background: #60a5fa; box-shadow: 0 0 8px #60a5fa; }
    .dot-online { background: #34d399; box-shadow: 0 0 8px #34d399; }
    
    .content {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0;
      display: grid;
      gap: 12px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }
    .label { color: #94a3b8; }
    .value { color: #e2e8f0; font-weight: 500; text-align: right; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .tip {
      font-size: 11px;
      color: #64748b;
      line-height: 1.5;
    }
    .footer {
      display: flex;
      justify-content: flex-end;
      padding-top: 10px;
    }
    .btn {
      background: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 7px 20px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title"><img src="logo.png" style="width: 18px; height: 18px; object-fit: contain; vertical-align: middle; margin-right: 6px;" />字浮 CharFloat 运行状态</div>
    <div id="statusBadge" class="badge badge-ready">
      <span id="statusDot" class="dot dot-ready"></span>
      <span id="statusText">待命就绪</span>
    </div>
  </div>

  <div class="content">
    <div class="info-row">
      <span class="label">网关通信</span>
      <span id="gwText" class="value">127.0.0.1:19890 (请启动 Bridge)</span>
    </div>
    <div class="info-row">
      <span class="label">当前工作簿</span>
      <span id="wbText" class="value">—</span>
    </div>
    <div class="info-row">
      <span class="label">活动工作表</span>
      <span id="shText" class="value">—</span>
    </div>
    <div class="info-row">
      <span class="label">当前鼠标选区</span>
      <span id="selText" class="value">—</span>
    </div>
  </div>

  <div class="tip">
    提示：在 Cursor / Claude / WorkBuddy 中直接对话即可操作本表格，Agent 会自动随需连通网关。
  </div>

  <div class="footer">
    <button class="btn" onclick="closeDialog()">知道了</button>
  </div>

  <script>
    function updateUI() {
      const urlParams = new URLSearchParams(window.location.search);
      const isConnected = urlParams.get('connected') === 'true';
      const wb = urlParams.get('wb') || '—';
      const sh = urlParams.get('sh') || '—';
      const sel = urlParams.get('sel') || '—';

      const badge = document.getElementById('statusBadge');
      const dot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const gwText = document.getElementById('gwText');

      if (isConnected) {
        badge.className = 'badge badge-online';
        dot.className = 'dot dot-online';
        statusText.innerText = '在线连接中';
        gwText.innerText = '127.0.0.1:19890 (已连通)';
      } else {
        badge.className = 'badge badge-ready';
        dot.className = 'dot dot-ready';
        statusText.innerText = '待命就绪';
        gwText.innerText = '127.0.0.1:19890 (请启动 Bridge)';
      }

      document.getElementById('wbText').innerText = decodeURIComponent(wb);
      document.getElementById('shText').innerText = decodeURIComponent(sh);
      document.getElementById('selText').innerText = decodeURIComponent(sel);
    }

    function closeDialog() {
      if (typeof wps !== 'undefined' && wps.CloseDialog) {
        wps.CloseDialog();
      } else {
        window.close();
      }
    }

    window.onload = updateUI;
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'Enter') closeDialog();
    });
  </script>
</body>
</html>
